- id: CP-FACE-004
  description: SC-FACE-004：SHALL 分别显示校准中、数据不足、暂不支持或读取失败及破折号，且无数值Gauge；总览中其他有效指标仍可显示
  action: 参见 test-plan.md 对应 TC；开发完成后以实际执行命令和人工观察证据验收
