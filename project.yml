name: Wristlab
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  WristlabCore:
    path: Packages/WristlabCore
targets:
  Wristlab:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/Shared
      - Apps/Storage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirsery.wristlab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: work/Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Wristlab
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHealthShareUsageDescription: 读取心率、心率变异性、睡眠和运动，仅在本机计算个人状态趋势。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Apps/iOS/Wristlab.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    dependencies:
      - package: WristlabCore
      - target: WristlabWatch
        embed: true
  WristlabWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS
      - Apps/Shared
      - Apps/Storage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirsery.wristlab.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: work/Generated/watchOS-Info.plist
      properties:
        CFBundleDisplayName: Wristlab
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.mirsery.wristlab.complication
            CFBundleURLSchemes: [wristlab]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mirsery.wristlab
    entitlements:
      path: Apps/watchOS/WristlabWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mirsery.wristlab.watch]
    dependencies:
      - package: WristlabCore
      - target: WristlabWidget
        embed: true
  WristlabWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Apps/Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirsery.wristlab.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: work/Generated/widget-Info.plist
      properties:
        CFBundleDisplayName: Wristlab
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/Widgets/WristlabWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mirsery.wristlab.watch]
    dependencies:
      - package: WristlabCore
schemes:
  Wristlab:
    build:
      targets:
        Wristlab: all
  WristlabWatch:
    build:
      targets:
        WristlabWatch: all
