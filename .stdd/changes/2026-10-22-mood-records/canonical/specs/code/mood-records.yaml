meta:
  capability: mood-records
  change_id: 2026-10-22-mood-records
  created: '2026-10-22'
  confidence: high
requirements:
- id: REQ-MOOD-001
  description: 中文映射
  scenarios:
  - id: SC-MOOD-001
    confidence: high
    evidence: canonical/proposals/2026-10-22-mood-records.yaml
    given: 分类1–7、标签1–38、关联项1–18及越界值
    when: 取中文名
    then: SHALL 返回固定中文名，越界返回“未知”且不崩溃
    and: []
- id: REQ-MOOD-002
  description: 压力配对
  scenarios:
  - id: SC-MOOD-002
    confidence: high
    evidence: canonical/proposals/2026-10-22-mood-records.yaml
    given: 即时情绪记录时刻落在有值压力桶内、在桶结束后0/15/16分钟、只有无值桶、之前2分钟只有之后的桶、运动桶；每日心情在非UTC分析日跨午夜
    when: 配对压力
    then: SHALL 取包含该时刻的有值桶，否则其前15分钟内结束的最近有值桶，16分钟、只有无值桶或只有之后的桶时为空；运动桶标注运动中
    and:
    - 每日心情取当天半开分析日内有值桶中位数（偶数个取均值后四舍五入），无值为空
    - 报告stressTimeline覆盖D-6前15分钟至asOf，当天以外的桶不进入一天的节奏
    - 配对结果给出压力显示值与002分段
- id: REQ-MOOD-003
  description: 最近记录与时间线标记
  scenarios:
  - id: SC-MOOD-003
    confidence: high
    evidence: canonical/proposals/2026-10-22-mood-records.yaml
    given: 跨8天、含未来时间、窗口边界与重复ID的合成记录，非UTC与夏令时分析时区，含运动中、当天进行中与晚于报告的记录
    when: 生成最近7天列表与当天时间线标记
    then: SHALL 列表为最近7个分析日内、当前时刻（含）之前的记录按时间倒序去重；时间线只含当天即时情绪；行标出运动中、当天截至目前与晚于报告
    and: []
- id: REQ-MOOD-004
  description: 心情卡片与压力图标记
  scenarios:
  - id: SC-MOOD-004
    confidence: medium
    evidence: canonical/proposals/2026-10-22-mood-records.yaml
    given: 首页心情卡片与压力图
    when: 未连接、已连接无记录、有记录三种状态
    then: SHALL 分别显示连接按钮与说明、无记录说明、记录列表与同时段生理压力；压力图标出当天记录时刻并有图例；声明自报与非因果；演示模式标记合成
    and: []
