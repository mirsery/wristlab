    risk: "Watch 快照 TTL 污染手机有效期；图标掩盖缺数；可访问性仍读出首页分数。"
    mitigation: "直接从手机 MetricEstimate 和显式时钟生成展示；异常状态优先；独立展示与 UI 回归。"

success_criteria:
  - "今天页三指标不显示或通过 VoiceOver 播报 0–100 分数，状态与图标可理解，详情仍可查看有效数值和依据。"
  - "真实 0 电量与缺失可区分；缺数、校准、过期及 HR-only 有明确原因，不显示正常估算。"
