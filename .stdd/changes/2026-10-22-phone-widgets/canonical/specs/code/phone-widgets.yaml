meta:
  capability: phone-widgets
  change_id: 2026-10-22-phone-widgets
  created: '2026-10-22'
  confidence: high
requirements:
- id: REQ-PHONEW-001
  description: 快照缓存校验
  scenarios:
  - id: SC-PHONEW-001
    confidence: high
    evidence: canonical/proposals/2026-10-22-phone-widgets.yaml
    given: 有效真实快照、演示快照、损坏JSON、超过64KB、未知schema与清除标记快照
    when: 小组件读取phone-snapshot.json
    then: SHALL 只接受有效真实快照与清除标记，其余视为无快照（等待手机）
    and:
    - 无文件时同样为等待状态
- id: REQ-PHONEW-002
  description: 显示与时间线
  scenarios:
  - id: SC-PHONEW-002
    confidence: high
    evidence: canonical/proposals/2026-10-22-phone-widgets.yaml
    given: 快照含当前、部分、过期与缺失的指标
    when: 生成组件时间线与各指标显示
    then: SHALL 每个指标按ComplicationPresentation显示数值或原因，时间线包含现在与各指标失效时刻且不含过去时刻
    and:
    - 清除标记显示数据已清除且无数值
- id: REQ-PHONEW-003
  description: 注册与外观
  scenarios:
  - id: SC-PHONEW-003
    confidence: high
    evidence: canonical/proposals/2026-10-22-phone-widgets.yaml
    given: iPhone小组件扩展的生产配置
    when: 在独立宿主中执行配置body
    then: SHALL 每个配置输出成功标记，无fatal
    and: []
  - id: SC-PHONEW-004
    confidence: medium
    evidence: canonical/proposals/2026-10-22-phone-widgets.yaml
    given: 小/中、圆形、矩形、行内五种尺寸，有快照与无快照
    when: 渲染
    then: SHALL 数值、原因与更新时间可辨，锁屏视图标记隐私敏感
    and: []
