scenario_checkpoints:
- id: CP-FACE-001
  description: SC-FACE-001：SHALL 提供WristlabEnergy、WristlabReadiness、WristlabStress、WristlabOverview四个kind；Energy保留原kind且三种单指标支持圆形、矩形、行内、角落四种family，Overview仅支持矩形
  action: 参见 test-plan.md 对应 TC；开发完成后以实际执行命令和人工观察证据验收
  assertions:
  - type: exit_code
    expected: 0
- id: CP-FACE-002
  description: SC-FACE-002：SHALL 每格读取对应字段并保留quality、更新时间；不得独立计算分数或交叉取错字段
  action: 参见 test-plan.md 对应 TC；开发完成后以实际执行命令和人工观察证据验收
  assertions:
  - type: exit_code
    expected: 0
