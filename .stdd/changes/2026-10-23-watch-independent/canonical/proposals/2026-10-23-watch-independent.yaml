# 2026-10-23-watch-independent.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-23-watch-independent"
  title: "Watch 独立健康读取与本地报告"
  created: "2026-10-23T18:03:15.707724"
  status: draft
  version: "2.9"

why:
  problem: |
    当前Watch仅接收手机快照，首次使用和数据更新依赖手机。用户已确认新版可显示健康快照，并提出允许手表离开手机后独立使用。需要让手表经主动授权后读取自身可用的HealthKit记录、使用同一核心算法生成报告，同时明确与手机报告可能因数据窗口和配置不同而产生差异。
  motivation: "解除打开手机才能更新的依赖，不引入云服务或后台常驻。"

what_changes:
  - id: C1
    type: new
    description: "增加Watch主动连接健康、本地只读适配器、独立仓库和手动刷新；复用核心评分、不扩大读取类型。"
  - id: C2
    type: modified
    description: "Watch及表盘明确区分手表本地报告和手机同步快照，显示生成时间、过期和缺失原因，避免不同producer/revision或基线混用。"
  - id: C3
    type: modified
    description: "保留手机同步模式与离线缓存；用户明确选择模式，不因连接短暂变化静默切换数值。连接恢复后接收手机快照，但不自动覆盖当前本地报告。"
  - id: C4
    type: modified
    description: "定义双端停止/清除、配置来源、升级迁移及演示隔离，先验证前台独立刷新，再接入系统允许的后台机会。"

capabilities:
  new:
    - name: "watch-local-health"
      description: "Watch端主动授权、只读记录、同核心计算、独立持久化和前台刷新。"
  modified:
    - name: "watch-report-source"
      description: "本地报告与手机快照显式模式、来源/时效和表盘一致展示。"

constraints:
  - "先更新001/002/003/006规格；公式、门槛和模型版本不变，不补正常分数。"
  - "Watch历史可读范围须真机验证，不假定拥有手机全部记录。授权完成和可读数据分开，不把空查询当拒绝。"
  - "不使用运动会话、音频或扩展运行时伪装后台常驻；不承诺固定刷新间隔。"
  - "iCloud保持默认关闭；健康数据仅设备本地，无账户或后端。"
  - "保留手机与Watch现有数据；迁移、停止、清除边界必须有防晚回调复活测试。"
stakeholders: ["自用双端用户"]
risk_areas:
  - capability: watch-local-health
    risk: "Watch历史或部分类型不足，无法生成相同基线；资源和系统调度受限。"
    mitigation: "同算法而非承诺同数值，显示实际覆盖/原因；先前台验证，后台机会分开验收。"
  - capability: watch-report-source
    risk: "双producer、配置和清除语义混用导致报告跳变或旧数据复活。"
    mitigation: "仓库与来源分隔、显式模式选择；Phase2锁定配置权威和删除控制协议。"
non_goals:
  - "把手机全部页签、体重目标与运动计划搬到手表。"
  - "手机与手表合并上传原始健康记录、实时连续传感器采样、医疗诊断或算法调参。"
  - "依赖CloudKit、独立App Store发布或取消配对要求。"
critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: true
anchoring:
  level: L2
  reference_changes: ["2026-10-23-watch-refresh-handshake"]
  anchor_implementations: ["HealthRepository", "SnapshotReceiver", "WatchSnapshotDelivery"]

success_criteria:
  - "手机不可达时，Watch经主动授权可完成前台本地刷新并显示本地报告或明确的数据不足原因，不停留在等待手机。"
  - "手表本地与手机报告使用同一核心公式；输入相同时合成测试一致，实际输入不同时来源/覆盖/时间明确，不混合分值。"
  - "重启可恢复所选模式与对应缓存，App与表盘同来源、同报告；缺失、清除、过期、存储失败和producer切换均有验收。"
  - "恢复连接后仍能请求手机快照；用户选择手机模式时才展示该快照，不静默覆盖独立报告。"
  - "真机分别验证首次Watch授权、断连刷新、历史不足、重连、重启和清除；后台行为仅记录实际证据。"
