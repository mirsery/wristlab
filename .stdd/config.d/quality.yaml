verify:
  max_iterations: 3
  auto_fix: true
review:
  enabled: true
  max_rounds: 3
  agents: []
  severity_thresholds:
    critical: 0
    high: 0
test:
  framework: swift-testing
  unit_dir: Packages/WristlabCore/Tests
  integration_dir: Tests
quality:
  test: ./scripts/check.sh
  lint: git diff --check
  typecheck: ./scripts/build-apple.sh
  e2e:
    enabled: false
  coverage:
    enabled: false
tc_id:
  pattern: TC-{CAPABILITY}-{NNN}
  example: TC-SLEEP-001
