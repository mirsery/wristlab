meta:
  change_id: 2026-10-21-active-health-sources
  title: 修复历史失活来源遮挡当前健康输入
  created: '2026-10-21'
  status: draft
why:
  problem: 数量选源从全部150日保留数据挑选来源，导致60日计算窗口外的历史优先来源遮挡窗口内实际可读输入。
  motivation: 让当前心率进入压力、活动与电量计算，仍按真实覆盖和基线显示缺失/校准。
what_changes:
- id: C1
  description: 自动选源候选须在评估日之前60个分析日至asOf间有有效样本；窗口内维持原rank和group顺序。
  type: modified
- id: C2
  description: 明确用户来源优先级仍优先，revision内固定来源且返回该组全部保留历史，不逐桶混源。
  type: modified
- id: C3
  description: 回归引擎报告、来源切换epoch和缺失/校准行为；构建、设备安装与用户验收分别记录。
  type: modified
- id: C4
  description: 用户追加要求：手机/Watch显示具体缺失原因、有效基线进度与操作建议；区分电量无种子原因，不改数值公式或门槛。
  type: modified
capabilities:
  new: []
  modified:
  - name: active-health-sources
    description: 数量来源候选限定实际计算窗口
constraints:
- 修改数量选源候选资格及无seed解释/双端展示；评分公式、14日基线、时效及电量断链门槛不变。
- 睡眠按报告窗口选源，不扩大昨晚睡眠窗口、不改用户未睡标记。
- 合成夹具覆盖测试；真实健康样本及数值不导出。
stakeholders:
- 自用iPhone与Watch用户
risk_areas:
- capability: active-health-sources
  risk: 选源改变后旧基线/旧电量不能接续。
  mitigation: 同revision用固定来源的全量历史重算，既有sourceSignature变化推动epoch；集成测试验证。
non_goals:
- 不混合不同来源补缺口，不为了出分放松计算门槛。
- 不宣称睡眠空窗口已解决，不自动更改用户配置。
critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false
anchoring:
  level: L1
  reference_changes: []
  anchor_implementations: []
success_criteria:
- 合成旧Watch仅90日前有HR、另一来源近期有HR时，引擎生成近期压力桶，不报missingHR。
- 窗口内设备优先级、显式来源偏好、来源独立及单revision不混源均有回归。
- 来源改变触发报告/快照一致重建及epoch推进；未满足14日基线时仍校准。
- Core/spec/双端构建通过；设备安装、输入可用性和用户实际显示分别验证。
