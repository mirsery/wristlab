# 2026-10-23-integrated-weekly-review.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-23-integrated-weekly-review"
  title: "综合周报：睡眠、运动执行与体重的本地复盘"
  created: "2026-10-23T23:16:50.592335"
  status: draft
  version: "2.9"

why:
  problem: |
    现有睡眠趋势、近7日健康回顾、运动计划回顾和体重周均分散在不同页面。用户希望继续完善功能，同时避免页面再次变长；已同意优先设计综合周报，把现有事实整合成可解释的复盘与下一步操作入口。
  motivation: "从看数据转向理解本周和主动调整，不重复新增评分或图表。"

what_changes:
  - id: C1
    type: new
    description: "复用本机已有数据汇总睡眠、运动计划执行与体重周均，显式列出窗口、有效天数、缺失与数据更新时间。"
  - id: C2
    type: modified
    description: "今天页只新增紧凑摘要卡，趋势页提供综合周报二级详情入口，不增加底部Tab或替换现有健康/运动/体重分区。"
  - id: C3
    type: new
    description: "按可解释规则提供补记录、查看睡眠或检查计划的操作入口；计划调整继续走既有预览与用户确认，不自动加量。"

capabilities:
  new:
    - name: "integrated-weekly-review"
      description: "同一明确周期的本地综合复盘、紧凑入口与无副作用的下一步操作导航。"
  modified: []

impact:
  code:
    - "Core新增纯聚合展示模型及Swift Testing；iOS新增周报视图并接入PhoneDashboardView，必要时给DashboardModel增加只读输入组装。"
  config:
    - "不新增依赖、HealthKit权限、持久化字段或签名配置。"
  infrastructure:
    - "无后端、云服务或基础设施变更；iCloud保持默认关闭。"
constraints:
  - "沿用固定分析时区、kg、体重同日末次记录及至少3有效日门槛；未知不当零。"
  - "不修改评分、历史重建、睡眠聚合、运动活跃时段或既有趋势统计规则。"
  - "不把运动完成当减脂达标，不做医学、因果或目标日期预测。"
  - "计划和体重继续只存本机，演示隔离；用户要求暂缓真机，不安装或操作实体设备。"
stakeholders: ["自用iPhone与Watch用户"]
risk_areas:
  - capability: integrated-weekly-review
    risk: "不同窗口、未知数据或人工完成与健康证据混用，造成虚假改善和达标。"
    mitigation: "设计阶段锁定统计窗口与分母，分开记录来源，缺失和不足给出明确原因。"
  - capability: integrated-weekly-review
    risk: "入口堆叠、字体截断或跨演示来源保留旧内容。"
    mitigation: "一张摘要卡加二级详情；不新增Tab；测试导航来源失效与辅助字体。"
non_goals:
  - "本轮不实现习惯日记、作息提醒、HealthKit体重导入、云同步或Watch周报。"
  - "不录制运动、不新增通知、不自动采纳计划，不生成热量预算、减脂速度或达标预测。"
critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false
anchoring:
  level: L2
  reference_changes: ["2026-10-22-activity-weight-plan", "2026-10-22-trends-page-sections"]
  anchor_implementations: ["WeightProgress", "PlanningState.scheduledEntry", "WorkoutCompletion", "AnalysisClock"]

success_criteria:
  - "不新增一级Tab，今天摘要和趋势入口都可到达同一周报详情，原分区与筛选保留。"
  - "三类数据有相同且可见的回顾日期边界，均值和对比具备有效天数、更新时间及不足原因。"
  - "无健康报告仍可查看本地体重与手动计划；空健康数据不推断拒绝或补成0。"
  - "人工完成、自动识别、休息与待确认可区分；休息不算运动完成，记录修订能更新周报。"
  - "下一步入口不直接修改配置或计划；演示、清除、来源与时区变化不展示旧周报。"
