name: Wristlab
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  WristlabCore:
    path: Packages/WristlabCore
targets:
  Wristlab:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirsery.wristlab
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: work/Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Wristlab
        NSHealthShareUsageDescription: 读取你的心率变异性，在本机展示健康趋势。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Apps/iOS/Wristlab.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: WristlabCore
      - target: WristlabWatch
        embed: true
  WristlabWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS
      - Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mirsery.wristlab.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: work/Generated/watchOS-Info.plist
      properties:
        CFBundleDisplayName: Wristlab
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mirsery.wristlab
    dependencies:
      - package: WristlabCore
schemes:
  Wristlab:
    build:
      targets:
        Wristlab: all
  WristlabWatch:
    build:
      targets:
        WristlabWatch: all
