meta:
  capability: metric-contributions
  change_id: 2026-10-21-metric-insights
  created: '2026-10-21'
  confidence: high
requirements:
- id: REQ-CONTRIB-001
  description: 准备度贡献分解
  scenarios:
  - id: SC-CONTRIB-001
    confidence: high
    evidence: canonical/proposals/2026-10-21-metric-insights.yaml C1
    given: 准备度有数值且未过期，contributions含hrv、baselineHRV、zHRV、rhr、baselineRHR、zRHR
    when: 生成贡献行
    then: SHALL 按HRV、静息心率顺序输出两行，各含当前值、个人基线与差值（当前值与基线各按单位取整后相减）
    and:
    - zHRV≥0.5显示“推高准备度”，≤−0.5显示“拉低准备度”，其余显示“接近个人基线”
    - zRHR同规则；zRHR为正表示静息心率低于基线
- id: REQ-CONTRIB-002
  description: 压力贡献分解
  scenarios:
  - id: SC-CONTRIB-002
    confidence: high
    evidence: canonical/proposals/2026-10-21-metric-insights.yaml C1；design.md 决策3
    given: 压力有数值且未过期，quality为complete，contributions含hr、baselineHR、zHR、zHRV
    when: 生成贡献行
    then: SHALL 输出心率行（当前值、基线、差值、推高/降低压力/接近个人基线）及仅含方向与效果的HRV行
    and:
    - zHRV为正表示HRV低于基线、推高压力
    - 跨睡眠边界的partial+sourceConflict桶仍用到HRV，照常列HRV行
    - zHRV非有限值时不列HRV行
  - id: SC-CONTRIB-003
    confidence: high
    evidence: design.md 决策3
    given: 压力为HR-only（reasons含hrOnly）或mode为activity
    when: 生成贡献行
    then: SHALL 只输出心率行，不输出HRV行
    and: []
- id: REQ-CONTRIB-003
  description: 缺失与过期不输出
  scenarios:
  - id: SC-CONTRIB-004
    confidence: high
    evidence: canonical/proposals/2026-10-21-metric-insights.yaml success_criteria
    given: 指标无数值、已过期，或某输入缺少当前值、基线或z中任一键
    when: 生成贡献行
    then: SHALL 不为该输入输出行；无数值或过期时结果为空
    and:
    - 任何输出文本不含z值、zHRV等内部键名
- id: REQ-CONTRIB-004
  description: 规格分段短句
  scenarios:
  - id: SC-CONTRIB-005
    confidence: high
    evidence: specs/002-scoring.md 准备度与压力显示分段
    given: 准备度或压力显示整数位于各分段边界，或电量有数值，或指标无数值
    when: 取分段短句
    then: SHALL 准备度0–32为“较低”、33–66为“接近个人常态”、67–100为“较高”；压力0–19“低”、20–59“常态”、60–79“偏高”、80–100“高”
    and:
    - 电量返回nil，无数值返回nil
    - 真实0返回最低分段
  - id: SC-CONTRIB-006
    confidence: medium
    evidence: canonical/proposals/2026-10-21-metric-insights.yaml C2
    given: 首页准备度卡与压力卡有数值
    when: 渲染首页
    then: SHALL 准备度标题显示“准备度”加分段短句，压力卡显示分段；不出现“给自己一点休息”等建议性文案
    and:
    - 详情页贡献行替代原始contributions键列表
