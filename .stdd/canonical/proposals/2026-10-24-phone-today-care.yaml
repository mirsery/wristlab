why:
  problem: |
    手机今天页仍以醒目的准备度、电量和压力分数呈现，用户不容易理解，也与手表的日常关怀方向不一致。
    本轮只改造现有首页卡片，让状态、数据局限和详情入口更易理解，不新增健康推断。

what_changes:
  - id: C1
    type: modified
    description: "原位置改造三张指标卡片：准备度、压力用图标和短句；电量保留连续视觉但不显示醒目分数、不新增分档。"
  - id: C2
    type: modified
    description: "校准、缺失、部分数据和过期状态明确显示；原始数值、依据、数据时间与报告更新时间保留在详情。"
  - id: C3
    type: modified
    description: "覆盖展示边界、详情导航、大字体与辅助功能，运行回归及模拟器验证，不更新稳定真机版。"

capabilities:
  new: []
  modified:
    - name: "phone-today-care"
      description: "今天页的三指标状态展示及其详情入口；对应 P010 和 metric-insights。"

constraints:
  - "仅使用现有 MetricEstimate 和展示分段，不改公式、模型版本、有效期或评分输入。"
  - "缺失数据不得显示正常状态或正常电量；不从生理压力推断心情或心理疾病。"
  - "保留原有日计划、睡眠/活动摘要、页签及演示标识，不增加首页内容层级。"
  - "仅本地代码、测试与模拟器；不安装、卸载、清除或操作真机数据。"
  - "不提交、不推送；保留其他未提交改动。"
non_goals:
  - "不增加健康权限、通知、健康数据上传或 iCloud 能力；iCloud 继续默认关闭。"
  - "不新增心情推算、运动处方、压力评分算法或电量高低阈值。"
  - "不修改 Watch、表盘、后台同步或手机健康读取任务。"
