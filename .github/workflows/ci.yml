name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core and specs
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        # Self-use project: only the newest released Xcode is supported.
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - run: ./scripts/check.sh
  apple:
    name: iOS and watchOS build
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        # Self-use project: only the newest released Xcode is supported.
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen && xcodegen --version
      - run: ./scripts/build-apple.sh
      - name: Capture synthetic app screenshots
        # Best effort: CI simulators have hung on app launch with unchanged code (#5, main after #9, #10).
        # Build, tests and widget registration above remain required; committed screenshots are checked by check_specs.
        continue-on-error: true
        timeout-minutes: 12
        run: python3 scripts/capture-screenshots.py
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simulator-screenshots
          path: work/screenshots/
          if-no-files-found: warn
