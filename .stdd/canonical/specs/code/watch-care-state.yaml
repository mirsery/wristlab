meta:
  capability: watch-care-state
  change_id: 2026-10-23-watch-daily-care
  created: '2026-10-23'
  confidence: medium
requirements:
  - id: REQ-WCS-001
    description: "心理感受只由用户自报，私有且可撤回。"
    scenarios:
      - id: WCS-001
        confidence: high
        evidence: "proposal C3；用户图标要求；design Decision 2/4"
        given: "没有当天心情或已有用户记录"
        when: "跳过、选择图标并确认、修改或删除"
        then: "SHALL只在主动确认后保存当天一条开心/平静/一般/低落/紧绷选择，取消不写、可改删，不从传感器推断或用生理压力纠正心情。"
        and:
          - "SHALL无自动HealthKit写授权、无评分输入、无连续打卡或未记录责备。"
      - id: WCS-002
        confidence: high
        evidence: "proposal C3/C4；EXP-20261022-008；design Decision 4/6"
        given: "表单捕获日期/时区/演示代次，期间跨日/时区或来源变化、损坏/不可读文件"
        when: "尝试提交或重启恢复"
        then: "SHALL拒绝旧身份日期提交；心情只在私有受保护本机store保存，旧日不显示为今天，演示不落盘，损坏保留并说明。"
        and:
          - "SHALL不包含自由文本、设备ID、日志、共享投影、手机或云副本，启动/成功写入清理旧日，清理失败不展示旧日。"
  - id: REQ-WCS-002
    description: "关怀基于事实，温柔且无自动干预。"
    scenarios:
      - id: WCS-003
        confidence: medium
        evidence: "proposal C3及非目标；用户小确幸方向；design Decision 4"
        given: "数据不可用/过期、用户自报、有效非运动偏高压力、真实未暂停目标达成或其他状态"
        when: "生成关怀卡"
        then: "SHALL按设计固定优先级最多一条，接纳自报，仅对有效事实肯定；未知不称恢复很好，运动不推断紧张，不称减脂或心理改善。"
        and:
          - "SHALL未闭环/未签到不责备，卡可收起；不发通知/震动、不自动改目标或给医疗保证。"
  - id: REQ-WCS-003
    description: "迁移投影与清除不混源、不复活。"
    scenarios:
      - id: WCS-004
        confidence: high
        evidence: "proposal C4；WI-S-002/003/005；design Decision 6"
        given: "旧schema1 envelope、不同mode/profile报告、超大趋势或writer失败"
        when: "派生并提交care投影、切源或重试"
        then: "SHALL旧包缺可选care字段可读；App/Widget只在同一原子包保存成功后发布，来源/profile身份校验，手机模式不借本地图，活动单独标本机。"
        and:
          - "SHALL整包仍≤40000bytes、手机协议不变，超限只移除可选趋势并说明；失败保留旧包并区分私有保存/展示失败，无心情共享。"
      - id: WCS-005
        confidence: high
        evidence: "proposal C4；WI-L-004/WSOURCE-004；design Decision 6"
        given: "活动/评分/心情/手机副本都有数据且查询或保存可能晚回"
        when: "停止活动、确认停止并清除手表本地数据、手机clear或重启"
        then: "SHALL停止活动只清活动；全手表本地清除先持久停止标记再取消/清评分活动心情，确认明确范围；手机clear不清本地分区。"
        and:
          - "SHALL标记/清理失败如实保留错误并停止，晚回和重启不复活，重新读取需主动连接，不删除Apple健康原始数据。"
