name: Bug report
description: Report a reproducible issue with synthetic data.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include OS/device versions. Remove all personal health data and identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Use synthetic examples only.
