meta:
  capability: active-health-sources
  change_id: 2026-10-21-active-health-sources
  created: '2026-10-21'
  confidence: high
requirements:
- id: REQ-SOURCE-001
  description: 历史失活来源
  scenarios:
  - id: SC-SOURCE-001
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 旧优先来源仅在60日计算窗口外有记录，另一个来源窗口内有有效记录
    when: 自动选源并评估报告
    then: SHALL 选择窗口内有效来源，不让历史来源遮挡当前压力桶
    and: []
- id: REQ-SOURCE-002
  description: 保留既有优先级
  scenarios:
  - id: SC-SOURCE-002
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 多个来源均在窗口内有有效记录
    when: 自动选源
    then: SHALL 继续按Watch、第三方、iPhone及group顺序固定单组，不按每桶填补缺口
    and: []
- id: REQ-SOURCE-003
  description: 明确偏好优先
  scenarios:
  - id: SC-SOURCE-003
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 用户明确指定的来源仍有保留记录，即使其不在当前窗口
    when: 选择HR、RHR或HRV来源
    then: SHALL 尊重明确偏好，不静默改用户配置；不同类型独立选择
    and: []
- id: REQ-SOURCE-004
  description: 边界及完整历史
  scenarios:
  - id: SC-SOURCE-004
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 候选来源有窗口边界、窗口外和未来样本
    when: 构建候选组及输出选定组记录
    then: SHALL 用有效样本end在起点至asOf闭区间判定候选；排除未来；返回选定组全部保留有效历史
    and: []
- id: REQ-SOURCE-005
  description: 确实缺失与校准
  scenarios:
  - id: SC-SOURCE-005
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 没有自动候选或选中当前HR但无14日有效基线
    when: 运行评分
    then: SHALL 分别保持必要输入缺失或校准，不生成默认数值
    and: []
- id: REQ-SOURCE-006
  description: 来源切换一致重建
  scenarios:
  - id: SC-SOURCE-006
    confidence: high
    evidence: canonical/proposals/2026-10-21-active-health-sources.yaml C1/C2/C3
    given: 持久化报告使用历史失活来源，刷新后选择有效来源
    when: 仓库apply并发布快照
    then: SHALL 重算报告与电量，sourceSignature变化时推进epoch，并让快照指标与报告一致
    and: []
- id: REQ-EXPLAIN-001
  description: 夜间基线不足
  scenarios:
  - id: SC-EXPLAIN-001
    confidence: high
    evidence: 用户追加原文：但是要有提示给用户告知原因；proposal C4
    given: 已有主睡眠及配对夜间输入，但历史不足14个有效日
    when: 构建无seed电量估算
    then: SHALL 使用calibrating、baselineNotReady及真实baselineDays，不错误归因缺少睡眠
    and: []
- id: REQ-EXPLAIN-002
  description: 必要夜间输入缺失
  scenarios:
  - id: SC-EXPLAIN-002
    confidence: high
    evidence: 用户追加原文：但是要有提示给用户告知原因；proposal C4
    given: 主睡眠、夜间HRV或对应RHR缺少一种
    when: 构建无seed电量估算
    then: SHALL 分别给出必要输入原因，不造分数或放松门槛
    and: []
- id: REQ-EXPLAIN-003
  description: 双端可见且同一解释
  scenarios:
  - id: SC-EXPLAIN-003
    confidence: high
    evidence: 用户追加原文：但是要有提示给用户告知原因；proposal C4
    given: 同步包含校准或缺失原因的指标
    when: 手机/Watch首页及详情展示
    then: SHALL 首页直接说明原因与X/14进度，详情提供操作建议；同步沿用原schema与理由字段
    and: []
- id: REQ-EXPLAIN-004
  description: 状态优先与未知回退
  scenarios:
  - id: SC-EXPLAIN-004
    confidence: high
    evidence: 用户追加原文：但是要有提示给用户告知原因；proposal C4
    given: 真实零、过期、低覆盖、未知原因或无快照
    when: 生成说明及展示值
    then: SHALL 保留真实0、过期隐藏旧值并说明刷新、覆盖不足说明门槛，未知原因中性回退且不推断拒绝权限
    and: []
