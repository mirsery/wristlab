meta:
  capability: morning-brief
  change_id: 2026-10-22-morning-brief
  created: '2026-10-22'
  confidence: high
requirements:
- id: REQ-BRIEF-001
  description: 是否发送
  scenarios:
  - id: SC-BRIEF-001
    confidence: high
    evidence: canonical/proposals/2026-10-22-morning-brief.yaml
    given: 真实报告分别为：今天且有已完成主睡眠、今天已发过、今天无主睡眠、非今天的报告、演示来源；时刻为05:00前、05:00、14:00前与14:00；非UTC分析时区
    when: 判定晨报
    then: SHALL 只有今天、真实、有已完成主睡眠、在05:00（含）至14:00（不含）且未发过时返回通知，其余为空
    and:
    - 已发记录按分析日（固定时区）比较
- id: REQ-BRIEF-002
  description: 通知内容
  scenarios:
  - id: SC-BRIEF-002
    confidence: high
    evidence: canonical/proposals/2026-10-22-morning-brief.yaml
    given: 准备度有值、日间回退、部分估算、校准中、过期，含小睡的睡眠窗口，以及隐藏数值开关
    when: 生成晨报文案
    then: SHALL 显示准备度数值与002分段（并标日间或部分估算）或具体缺失原因，以及主睡眠时长（不含小睡）；隐藏数值时不含任何数值或原因
    and:
    - 不含训练或健康建议
- id: REQ-BRIEF-003
  description: 设置与投递
  scenarios:
  - id: SC-BRIEF-003
    confidence: medium
    evidence: canonical/proposals/2026-10-22-morning-brief.yaml
    given: 设置页晨报开关与隐藏数值开关，真机
    when: 开启、拒绝授权、系统事后关闭通知、前台与后台刷新、清除数据
    then: SHALL 开启时请求授权，拒绝或被关闭时在设置页说明；满足条件的真实刷新后投递一次（前台也显示）；清除数据撤回已送达晨报
    and: []
