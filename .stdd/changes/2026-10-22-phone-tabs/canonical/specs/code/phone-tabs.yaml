meta:
  capability: phone-tabs
  change_id: 2026-10-22-phone-tabs
  created: "2026-10-22"
  confidence: high
requirements:
  - id: REQ-NAV-001
    description: "五Tab与浏览状态"
    scenarios:
      - id: SC-NAV-001
        confidence: high
        evidence: "proposal.yaml what_changes / success_criteria; design.md Decisions"
        given: "已打开真实或演示报告"
        when: "进入详情、滚动并往返切换Tab"
        then: "SHALL显示今天、睡眠、活动、趋势、我的，初始为今天；当前会话保留各页路径、滚动与趋势筛选，不重复触发读取或授权"
        and: []
  - id: REQ-NAV-002
    description: "今天精简与入口"
    scenarios:
      - id: SC-NAV-002
        confidence: high
        evidence: "proposal.yaml what_changes / success_criteria; design.md Decisions"
        given: "报告可用或部分缺失"
        when: "打开今天并点击摘要"
        then: "SHALL只包含核心三指标、睡眠和活动摘要及数据状态；三指标可进入解释详情，主题摘要切到对应Tab，完整曲线及列表仅在主题页"
        and: []
  - id: REQ-NAV-003
    description: "大字体与读屏"
    scenarios:
      - id: SC-NAV-003
        confidence: high
        evidence: "proposal.yaml what_changes / success_criteria; design.md Decisions"
        given: "合成完整报告与空报告"
        when: "用辅助功能字体、VoiceOver与减少动态效果浏览五Tab"
        then: "SHALL保留所有入口，不截断关键值和操作；可读指标、单位、日期、状态，系统减少动态效果可用"
        and: []
