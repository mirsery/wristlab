# 2026-10-23-watch-daily-care.yaml — Canonical Proposal (YAML-first, V2.9)
# AI 起草、AI 修改、AI 消费。Human View 由 `stdd canon generate` 生成。

meta:
  change_id: "2026-10-23-watch-daily-care"
  title: "Watch日常关怀版：图标状态、活动圆环与自报心情"
  created: "2026-10-23T23:47:17.148160"
  status: draft
  version: "2.9"

why:
  problem: |
    用户认为Watch界面、图表及表盘不好看，缺少每日步数、活动分钟和活动圆环；希望重点关注日常身心健康与温柔关怀，而非训练成绩单。现有三项分数和小字缺少可理解状态。用户已对关怀首页、可解释生理压力、可选心情签到、小确幸反馈和图表表盘改造范围回复“开始”，并补充心情/压力用图标表达，避免直接给分数。
  motivation: "先改善抬腕就能理解的日常陪伴体验，综合周报保留独立设计，不混入本轮。"

what_changes:
  - id: C1
    type: modified
    description: "Watch采用关怀/活动/状态三页，图标加短标签为主，隐藏默认0–100评分，保留事实数值及单位、原因、来源与更新时间；本地真实报告支持压力趋势。"
  - id: C2
    type: new
    description: "主动只读连接手表可用的每日步数与Apple活动摘要，显示活动分钟、真实目标和圆环，识别暂停/未知，不录制运动或写健康。"
  - id: C3
    type: new
    description: "可选本机心情签到与确定性的温柔反馈；心理感受由用户自报，压力沿用HR/HRV个人基线实验估算，不作诊断、因果或训练处方。"
  - id: C4
    type: modified
    description: "重做既有圆形/矩形/行内/角落组件的图标状态展示，增加本机步数活动入口；定义原子缓存、缺失/过期、演示、停止清除与升级兼容。"

capabilities:
  new:
    - name: "watch-daily-activity"
      description: "额外主动授权的只读步数/活动摘要及系统目标、暂停与日历语义。"
    - name: "watch-care-state"
      description: "本机心情记录、关怀规则和App/组件一致的受保护派生投影。"
  modified:
    - name: "watch-care-presentation"
      description: "P-004/P-007与WI-L/WI-S之上的图标化导航、压力解释/图表与组件布局，不改评分公式。"
impact:
  code:
    - "Core新增平台无关活动/心情/关怀展示模型；Watch新增独立HealthKit日常活动适配器和本地状态存储，调整协调器/页面/组件并补合成测试。"
  config:
    - "更新Watch只读健康用途文案；不增加写权限、后台模式、依赖或team设置。"
  infrastructure:
    - "无服务端、账号或云变更，iCloud默认关闭，保留手机同步通道。"
constraints:
  - "分数可内部用于既定分段，不在Watch默认页面或组件直接展示；步数/分钟/心率等事实仍显示单位。"
  - "压力复用specs/002的HR/可选HRV/同情境基线、14有效日与15分钟时效，不从高心率推断心理压力。"
  - "未连接、无数据、校准、失败、过期与真实0不同，图标须有文字/VoiceOver，颜色不是唯一状态。"
  - "HealthKit只读、主动新增授权；心情仅用户自报本机保存，不写Apple健康，不进入评分或手机/云。"
  - "本轮先文档/合成场景/模拟器；不在设计阶段覆盖安装或请求真实健康导出，设备验收与Gate 3分别确认。"
stakeholders: ["希望获得温柔日常关怀的Watch用户"]
risk_areas:
  - capability: watch-care-presentation
    risk: "友好图标掩盖未知/过期或把生理估算当心理判断，旧分数隐含医学意义。"
    mitigation: "固定状态字典、优先缺失/活动情境，保留事实解释、实验标签与非诊断边界。"
  - capability: watch-daily-activity
    risk: "新增权限、系统日与固定分析日不同、多来源重复与活动目标暂停。"
    mitigation: "独立主动读取，不混源累加；明确系统活动日期，使用真实可用目标和暂停状态。"
  - capability: watch-care-state
    risk: "情绪记录泄露、跨来源缓存混用、清除晚回调复活。"
    mitigation: "本地受保护最小记录、不进入表盘，原子投影与停止标记/代次测试。"
non_goals:
  - "不实现心理诊断、情绪自动检测、相关性推断、AI教练、饮食预算或医疗告警。"
  - "不录制跑步/常驻传感器、不写健康或改系统圆环目标，不新增推送/震动催促/连续打卡。"
  - "不实施综合周报、iPhone全面改版、跨端心情同步、任意自定义系统表盘或固定后台刷新承诺。"
critical:
  is_critical: true
  risk_assessment:
    safety_critical: true
    financial: false
    cross_system: false
anchoring:
  level: L3
  reference_changes: ["2026-10-23-watch-independent", "2026-10-23-watch-refresh-handshake", "2026-10-22-activity-weight-plan"]
  anchor_implementations: ["WatchReportModel", "WatchDisplayStore", "ComplicationPresentation", "HealthRepository"]

success_criteria:
  - "Watch主页面与组件无直接0–100评分，心情/压力由可区分图标及短标签表示，未知不呈正常表情。"
  - "主动连接后步数、活动分钟/圆环独立可用，真实0/无数据/暂停/缺目标有区别，失败保留旧值但明确时效。"
  - "压力等级沿用既定模型，运动/HR-only/校准/过期明确；曲线缺口不补，手机模式无历史不伪造图。"
  - "心情可跳过/改/删，不参与评分或默认进入表盘；关怀基于可核对事实，不责备未闭环，不自动改变目标。"
  - "App/组件消费同次原子投影，升级保留原手机模式与数据；演示/清除/源切换不复活旧内容。"
  - "大字、减少动态效果、单色组件与滚动可用；模拟器和真机证据分别记录，不以构建代验收。"
