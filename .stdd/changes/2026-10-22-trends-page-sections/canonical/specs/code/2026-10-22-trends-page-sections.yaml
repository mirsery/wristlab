# spec.yaml — 行为规格（Canonical YAML）

meta:
  capability: "trends-presentation"
  change_id: "2026-10-22-trends-page-sections"
  created: "2026-10-22T20:30:24.298232"
  confidence: medium

requirements:
  - id: "REQ-001"
    description: "趋势主题分区保留现有功能、真实周期与来源边界。"
    scenarios:
      - id: "SC-TRENDUI-001"
        given: "报告与本地计划体重存在"
        when: "查看健康、运动、体重分区"
        then: "SHALL按设计归属显示，保留全部原能力，分别标明图表与回顾周期。"
      - id: "SC-TRENDUI-002"
        given: "会话内已有分区、指标、周期和位置选择"
        when: "切换主题、底部Tab或刷新"
        then: "SHALL保留适用展示状态，不因切换额外读取健康或写入计划。"
      - id: "SC-TRENDUI-003"
        given: "没有健康报告"
        when: "访问三个主题"
        then: "SHALL允许本地计划回顾与体重目标记录，健康缺失不补分或推断拒绝，周均门槛不变。"
      - id: "SC-TRENDUI-004"
        given: "演示编辑、日内详情、旧报告或辅助字体"
        when: "切换来源、清除、滚动与导航"
        then: "SHALL失效旧弹窗、避免跨来源写入，状态清晰且内容不遮挡。"
