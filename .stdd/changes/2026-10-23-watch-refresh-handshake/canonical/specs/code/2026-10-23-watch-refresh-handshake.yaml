# spec.yaml — 行为规格（Canonical YAML）

meta:
  capability: "watch-sync"
  change_id: "2026-10-23-watch-refresh-handshake"
  created: "2026-10-23T15:55:41.437133"
  confidence: medium

requirements:
  - id: "REQ-001"
    description: "H-007：刷新请求回执与快照实际接收分别确认。"
    scenarios:
      - id: "SC-001"
        confidence: high
        evidence: "proposal what_changes 与用户已请求但无数据反馈"
        given: "无快照且手机不可达或激活失败"
        when: "请求刷新"
        then: "SHALL 展示连接原因而非已收到数据，保留旧缓存。"
      - id: SC-002
        confidence: high
        evidence: "proposal success_criteria"
        given: "手机可达且有合法真实快照"
        when: "手表请求刷新"
        then: "SHALL 交付已有快照并尝试刷新；仅校验落盘成功才显示收到。"
      - id: SC-003
        confidence: high
        evidence: "proposal 无快照与失败可区分"
        given: "手机收到请求但无快照、未连接健康或刷新失败"
        when: "手机处理请求"
        then: "SHALL 回传明确无值原因；不以空快照或演示伪装成功。"
      - id: SC-004
        confidence: medium
        evidence: "proposal 旧协议兼容"
        given: "旧手机无回执，或重复点击、迟到回复"
        when: "请求后等待15秒或收到迟到结果"
        then: "SHALL 有界结束等待、合并并发请求并隔离旧回复；原context仍可接收。"
      - id: SC-005
        confidence: high
        evidence: "proposal 缓存与清除标记边界"
        given: "清除标记、旧revision、新producer或落盘失败"
        when: "经回复或context接收快照"
        then: "SHALL 统一经过既有接收规则，不绕过确认、不复活已清数据、不误报保存成功。"
