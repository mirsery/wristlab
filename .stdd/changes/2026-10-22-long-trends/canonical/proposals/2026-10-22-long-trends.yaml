meta:
  change_id: 2026-10-22-long-trends
  title: 长期趋势、个人基线区间与近7日回顾
  created: '2026-10-22'
  status: draft
why:
  problem: 趋势只有7日，看不出几周的走向；夜间HRV与静息心率是准备度的输入，却没有逐日展示，也没有个人常态范围可对照；没有本周与过去几周的比较。
  motivation: 'issue #6候选#5与#9（参考Oura/Apple Vitals的个人范围、HRV4Training的60日常态、WHOOP/Oura周报）。引擎已保留61个分析日的逐日基础，可在不扩大读取窗口、不改公式的前提下展示。'
what_changes:
- id: C1
  description: 报告7日history扩展为35日；DayOverview新增可选nightHRV（主睡眠内有效HRV至少2条时的中位数）与restingHeartRate（当日静息心率）。
  type: modified
- id: C2
  description: 报告新增可选personalRanges（个人基线区间）：仅当今天准备度为夜间模式时，用与今天准备度完全相同的夜间基线（前60个分析日、今天主睡眠来源、至少14个有效夜晚）给出|z|<0.5对应的HRV与静息心率区间；否则为nil。
  type: new
- id: C3
  description: 趋势支持7/30日切换，指标增加夜间HRV与静息心率；HRV/静息心率图叠加个人常态范围带；缺失日留白。
  type: modified
- id: C4
  description: 新增近7日回顾：近7日（含今天）与此前28日在准备度、睡眠、夜间HRV、静息心率上的均值、有效天数与差值；有效天不足时显示记录不足，不下因果结论。
  type: new
capabilities:
  new:
  - name: long-trends
    description: 35日逐日历史、个人常态范围与7/30日趋势（C1–C3）
  - name: weekly-review
    description: 本周与前4周对比（C4）
  modified: []
constraints:
- 不扩大HealthKit读取窗口或类型；评分公式、门槛、模型版本、Watch同步schema与Watch端不变；12份数值金例不变。
- 个人常态范围复用准备度的夜间基线与分布（中位数与MAD尺度及其下限），只是展示区间。
- 缺失保持缺失；新增字段均为Optional，旧缓存可解码；时间按固定分析时区。
- 不做医疗判断，不给训练或生活建议；周回顾只陈述差值。
stakeholders:
- 自用iPhone用户
risk_areas:
- capability: long-trends
  risk: 范围带被理解为医学正常值。
  mitigation: 命名为“个人常态范围”，说明来自本人前60日，不是人群标准。
- capability: weekly-review
  risk: 有效天很少时均值误导。
  mitigation: 本周至少3个有效日、前4周至少10个有效日才给均值与差值。
non_goals:
- 90日趋势、负荷周对比、相关性或原因分析、Watch端趋势。
critical:
  is_critical: false
  risk_assessment:
    safety_critical: false
    financial: false
    cross_system: false
anchoring:
  level: L2
  reference_changes:
  - 2026-10-21-metric-insights
  anchor_implementations:
  - Packages/WristlabCore/Sources/WristlabCore/InsightPresentation.swift
  - Packages/WristlabCore/Sources/WristlabCore/Physiology.swift
success_criteria:
- 引擎输出35日history，含逐日夜间HRV与静息心率；准备度、压力、电量数值与改动前一致。
- 个人常态范围等于准备度基线中位数±0.5尺度（HRV按对数）；不足14日为nil。
- TrendSeries支持30日与HRV/静息心率，缺失日为nil。
- 周回顾均值、有效天数门槛与差值有单测；不足时为nil。
- 旧缓存JSON缺新字段可解码；check.sh与build-apple.sh通过；模拟器截图视觉检查；真机由用户验收。
